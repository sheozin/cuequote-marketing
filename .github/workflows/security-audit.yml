name: Security Audit

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      auto_fix:
        description: 'Run npm audit fix and open a PR?'
        type: boolean
        default: true

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  audit:
    name: Run Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # --ignore-scripts prevents postinstall RCE from malicious packages
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run audit script
        id: audit
        run: node .github/scripts/audit.js
        env:
          AUDIT_REPO: ${{ github.repository }}
          AUDIT_SHA:  ${{ github.sha }}
          AUDIT_REF:  ${{ github.ref_name }}

      - name: Upload audit JSON artifact
        uses: actions/upload-artifact@v4
        with:
          name: audit-results-${{ github.run_id }}
          path: .audit/results.json
          retention-days: 90

      # ── Auto-fix: run npm audit fix and open a PR if lockfile changed ──
      - name: Auto-fix dependencies
        id: fix
        if: ${{ inputs.auto_fix != false }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="security/auto-fix-$(date +%Y%m%d)"
          git checkout -b "$BRANCH"

          npm audit fix --audit-level=moderate 2>&1 | tee .audit/fix.log || true

          if git diff --quiet package-lock.json 2>/dev/null && git diff --quiet package.json 2>/dev/null; then
            echo "fix_applied=false" >> "$GITHUB_OUTPUT"
          else
            git add package-lock.json package.json
            git commit -m "security: npm audit fix $(date +%Y-%m-%d) [automated]"
            git push origin "$BRANCH"
            echo "fix_applied=true"   >> "$GITHUB_OUTPUT"
            echo "fix_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate markdown report
        run: node .github/scripts/generate-report.js
        env:
          FIX_APPLIED: ${{ steps.fix.outputs.fix_applied }}
          FIX_BRANCH:  ${{ steps.fix.outputs.fix_branch }}

      # ── Open auto-fix PR (safe: branch name is generated by this workflow) ──
      - name: Open auto-fix PR
        if: steps.fix.outputs.fix_applied == 'true'
        env:
          GH_TOKEN:   ${{ secrets.GITHUB_TOKEN }}
          FIX_BRANCH: ${{ steps.fix.outputs.fix_branch }}
        run: |
          gh pr create \
            --title "security: automated dependency fixes $(date +%Y-%m-%d)" \
            --body-file .audit/pr-body.md \
            --base main \
            --head "$FIX_BRANCH" \
            --label "security,dependencies,automated" \
            || echo "PR may already exist"

      # ── Close any stale open audit issue ──
      - name: Close stale audit issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_SHA:  ${{ github.sha }}
        run: |
          EXISTING=$(gh issue list \
            --label "security-audit" \
            --state open \
            --json number \
            --jq '.[0].number' 2>/dev/null || echo "")

          if [ -n "$EXISTING" ]; then
            gh issue close "$EXISTING" \
              --comment "Superseded by new audit run ($RUN_SHA)." \
              || true
          fi

      # ── Create new Issue with the report ──
      - name: Create audit Issue
        if: always()
        env:
          GH_TOKEN:    ${{ secrets.GITHUB_TOKEN }}
          HAS_ISSUES:  ${{ steps.audit.outputs.has_issues }}
          RUN_URL:     ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_SHA:     ${{ github.sha }}
        run: |
          if [ "$HAS_ISSUES" = "true" ]; then
            gh issue create \
              --title "Security Audit — $(date +%Y-%m-%d)" \
              --body-file .audit/report.md \
              --label "security-audit,automated"
          else
            gh issue create \
              --title "Security Audit — $(date +%Y-%m-%d) — All clear" \
              --body "$(printf '## All clear\n\nAll security checks passed (npm audit, secrets scan, SAST, headers).\n\nCommit: %s\nRun: %s' "$RUN_SHA" "$RUN_URL")" \
              --label "security-audit,automated"
          fi
